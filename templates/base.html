<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Career Explorer{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-xl text-indigo-600 flex items-center gap-2">
        <span>🎯</span> Career Explorer
      </a>

      <!-- 3-Lines (Hamburger) Menu Button -->
      <div class="relative">
        <button id="menu-btn" 
                onclick="toggleMenu()" 
                class="p-2 rounded-lg text-slate-600 hover:text-indigo-600 hover:bg-slate-100 transition focus:outline-none flex items-center gap-1.5"
                title="Menu">
          <span class="text-xs font-semibold text-slate-500 hidden sm:inline">Menu</span>
          <!-- 3 Horizontal Lines Icon -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div id="dropdown-menu" 
             class="hidden absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 transition-all">
          <div class="px-4 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Navigation</div>
          
          <!-- AI Chat Option -->
          <a href="/chat" class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-indigo-600 hover:bg-indigo-50 transition">
            <span class="p-1.5 bg-indigo-100 rounded-lg text-base">🤖</span>
            <div>
              <div>AI Career Chat</div>
              <div class="text-[11px] font-normal text-slate-500">Personalized Companion</div>
            </div>
          </a>

          <!-- Browse Categories Option -->
          <a href="/" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition">
            <span class="p-1.5 bg-slate-100 rounded-lg text-base">📚</span>
            <span>Browse Categories</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdown-menu');
      menu.classList.toggle('hidden');
    }

    // Close menu when clicking outside
    document.addEventListener('click', function(event) {
      const btn = document.getElementById('menu-btn');
      const menu = document.getElementById('dropdown-menu');
      if (!btn.contains(event.target) && !menu.contains(event.target)) {
        menu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
